<!DOCTYPE html>
<html lang="ar">
<head>

<style>
.top-header{
  background:#FF3B3F;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 20px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
  direction: rtl;
}

.logo img{
  height:45px;
}

.nav-links{
  display:flex;
  gap:20px;
  font-size:16px;
  font-weight:bold;
}

.nav-links a{
  color:#000;
  text-decoration:none;
}

.nav-links a:hover{
  color:#ff3b3f;
}

.search-btn{
  background:#ffffff;
  border-radius:50%;
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.search-btn img{
  width:18px;
}
</style>



<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأنمي زين</title>

<meta name="description" content="AnimeZine – موقع عربي لعشاق الأنمي، ملخصات، مراجعات وأخبار الأنمي">
<meta name="keywords" content="أنمي, Anime, ملخصات الأنمي, أخبار الأنمي">

<!-- ===== AdSense ===== -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9094508203387590" crossorigin="anonymous"></script>

<style>
body { font-family: Arial, sans-serif; background:#121212; color:#fff; margin:0; padding:0;}
header { background:#ff3b3f; padding:20px; text-align:center; font-size:28px; font-weight:bold; box-shadow:0 4px 10px rgba(0,0,0,0.5);}

.slider { position: relative; width: 100%; max-width: 1000px; margin: 20px auto; overflow: hidden; border-radius: 15px;}
.slides { display:flex; transition: transform 0.8s ease-in-out;}
.slide { min-width:100%; position:relative; cursor: grab; }

.prev, .next {
 position:absolute; top:50%; transform:translateY(-50%);
 background:rgba(0,0,0,0.6); color:#fff; border:none;
 border-radius:50%; padding:10px; cursor:pointer; z-index:10;
}
.prev{left:10px;} .next{right:10px;}

.anime-section { margin:20px 0; }
.anime-list { display:flex; flex-wrap:nowrap; overflow-x:auto; padding:10px; gap:10px; }
#animeList { flex-wrap: wrap; justify-content: center; overflow-x: visible; }

.anime-card {
 background:#1e1e1e; width:180px; border-radius:12px;
 overflow:hidden; cursor:pointer; transition:0.3s; flex-shrink:0; position:relative;
}
.anime-card:hover {transform:scale(1.05); box-shadow:0 0 15px #ff3b3f;}
.anime-card img{width:100%; height:220px; object-fit:cover}

.card-overlay{
 position:absolute; inset:0; background:rgba(0,0,0,0.7);
 display:flex; justify-content:center; align-items:center;
 opacity:0; transition:0.3s; text-align:center;
}
.anime-card:hover .card-overlay{opacity:1;}

.anime-type-badge {
 position:absolute; top:8px; left:8px; padding:4px 8px;
 border-radius:5px; font-size:12px; font-weight:bold; color:#fff;
}
.anime-type-badge.مسلسل{background:#28a745;}
.anime-type-badge.فيلم{background:#ff3b3f;}
.anime-type-badge.ملخّص{background:#ff9800;}

.more-card{
 background:#ff3b3f; display:flex; align-items:center; justify-content:center;
 font-size:18px; font-weight:bold; color:white; height:220px;
 border-radius:12px; cursor:pointer; flex-shrink:0;
}
.more-card:hover{background:#ff5559; transform:scale(1.05);}

#searchInput{
 padding:10px; width:80%; max-width:400px;
 display:block; margin:10px auto; border-radius:8px; border:none;
}

.category-filter{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:10px;}
.category-filter span{ background:#2a2a2a; padding:6px 14px; border-radius:20px; cursor:pointer;}
.category-filter span.active{font-weight:bold;}

.pagination{text-align:center;margin:10px;}
.pagination button{
 padding:6px 12px;border:none;border-radius:5px;
 background:#ff3b3f;color:#fff;cursor:pointer;
}
</style>
</head>

<body>

<!-- ===== Top Navigation Bar ===== -->
<div class="top-header">

  <!-- زر البحث -->
  <div class="search-btn" onclick="document.getElementById('searchInput').focus()">
    <img src="https://cdn-icons-png.flaticon.com/512/622/622669.png">
  </div>

  <!-- روابط المنيو -->
  <div class="nav-links">
   <a href="index.html">الرئيسية</a>
<a href="articles.html">مقالات الأنمي</a>
<a href="#" id="moviesLink">أفلام الأنمي</a>
<a href="#" id="seriesLink">مسلسلات الأنمي</a>
<a href="#" id="schedulink">ملخصات الأنمي</a>
<a href="contact.html">اتصل بنا</a>

  </div>

  <!-- اللوغو -->
  <div class="logo">
    <img src="https://i.postimg.cc/X7qqxbYp/logo.png" alt="AnimeZine">
  </div>

</div>




<div class="slider">
  <div class="slides" id="slides"></div>
  <button class="prev" onclick="prevSlide()">&#10094;</button>
  <button class="next" onclick="nextSlide()">&#10095;</button>
</div>

<input type="text" id="searchInput" placeholder="ابحث عن أنمي...">

<div class="category-filter" id="categoryFilter"></div>
<div class="category-filter" id="typeFilter"></div>

<div class="anime-section">
  <h2 style="text-align:center">🎯 الأنمي الرئيسي</h2>
  <div class="anime-list" id="animeList"></div>
  <div class="pagination">
    <button id="prevPage">الصفحة السابقة</button>
    <button id="nextPage">الصفحة التالية</button>
  </div>
</div>

<div class="anime-section"><h2>🔥 الأكثر مشاهدة</h2><div class="anime-list" id="mostViewedList"></div></div>
<div class="anime-section"><h2>💥 أنمي أكشن</h2><div class="anime-list" id="actionList"></div></div>
<div class="anime-section"><h2>📺 مسلسلات</h2><div class="anime-list" id="seriesList"></div></div>
<div class="anime-section"><h2>🎬 أفلام</h2><div class="anime-list" id="moviesList"></div></div>
<div class="anime-section"><h2>📝 ملخّصات</h2><div class="anime-list" id="summaryList"></div></div>

<footer class="site-footer">
  <nav>
<a href="index.html">الرئيسية</a> |
<a href="about.html">من نحن</a> |
<a href="privacy.html">سياسة الخصوصية</a> |
<a href="contact.html">اتصل بنا</a>
</nav>
<p>© 2026 AnimeZine</p>
</footer>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
 apiKey: "AIzaSyBYEyu6TxSv1qSLCRvr0YCdaVcewhxAmQY",
 authDomain: "appp-1234.firebaseapp.com",
 databaseURL: "https://appp-1234-default-rtdb.firebaseio.com",
 projectId: "appp-1234",
 storageBucket: "appp-1234.firebasestorage.app",
 messagingSenderId: "666495369108",
 appId: "1:666495369108:web:aabf062e066cea6c3b9981"
};
firebase.initializeApp(firebaseConfig);
const animesRef = firebase.database().ref('animes');

document.addEventListener("DOMContentLoaded", ()=>{

const slidesContainer = document.getElementById("slides");
const animeList = document.getElementById("animeList");
const searchInput = document.getElementById("searchInput");
const categoryFilter = document.getElementById("categoryFilter");
const typeFilter = document.getElementById("typeFilter");

let animes = [], currentIndex=0;
let currentPage=1;
const itemsPerPage=8;

const categories=["أكشن","مغامرة","نفسي","رياضي","غموض","كوميدي","دراما","رومانسي","خيال علمي","فانتازيا","شريحة من الحياة"];
const types=["مسلسل","فيلم","ملخّص"];
let activeFilters=[], activeTypeFilters=[];

categories.forEach(c=>{
 let sp=document.createElement("span");
 sp.textContent=c;
 sp.onclick=()=>{
   sp.classList.toggle("active");
   sp.style.background=sp.classList.contains("active")?"#ff3b3f":"#2a2a2a";
   activeFilters=[...categoryFilter.querySelectorAll(".active")].map(e=>e.textContent);
   renderAnimeList();
 };
 categoryFilter.appendChild(sp);
});

types.forEach(t=>{
 let sp=document.createElement("span");
 sp.textContent=t;
 sp.onclick=()=>{
   sp.classList.toggle("active");
   sp.style.background=sp.classList.contains("active")?"#28a745":"#2a2a2a";
   activeTypeFilters=[...typeFilter.querySelectorAll(".active")].map(e=>e.textContent);
   renderAnimeList();
 };
 typeFilter.appendChild(sp);
});

animesRef.on('value', snap=>{
 const data=snap.val(); if(!data) return;
 animes=Array.isArray(data)?data:Object.values(data);
 renderSlider();
 renderAnimeList();
 renderSection("mostViewedList",[...animes].sort((a,b)=>(b.views||0)-(a.views||0)),"mostViewed");
 renderSection("actionList",animes.filter(a=>a.category?.includes("أكشن")),"action");
 renderSection("seriesList",animes.filter(a=>a.type==="مسلسل"),"series");
 renderSection("moviesList",animes.filter(a=>a.type==="فيلم"),"movies");
 renderSection("summaryList",animes.filter(a=>a.type==="ملخّص"),"summary");
});

function buildCard(anime){
  const categoryColors = {
    "أكشن":"#ff3b3f",
    "مغامرة":"#ff9800",
    "نفسي":"#839b84ff",
    "رياضي":"#4caf50",
    "غموض":"#9c27b0",
    "كوميدي":"#ffeb3b",
    "دراما":"#03a9f4",
    "رومانسي":"#e91e63",
    "خيال علمي":"#00bcd4",
    "فانتازيا":"#8bc34a",
    "شريحة من الحياة":"#914ac3ff"
  };

  const card = document.createElement("div");
  card.className = "anime-card";

  card.innerHTML = `
    <div style="position:relative">
      <img src="${anime.image}" loading="lazy">
      
      <div class="card-overlay"><h3>${anime.title}</h3></div>
      
      ${anime.type ? `<span class="anime-type-badge ${anime.type}">${anime.type}</span>` : ''}

    </div>

    <!-- تصنيفات الأنمي -->
    <div style="
      padding:6px 8px;
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:4px;
      background:#2a2a2a;
      border-top:1px solid #444;
    ">
      ${(anime.category || []).map(c => `
        <span style="
          background:${categoryColors[c]||'#555'};
          color:${c==='كوميدي'?'#000':'#fff'};
          padding:2px 6px;
          border-radius:6px;
          font-size:11px;
        ">${c}</span>
      `).join('')}
    </div>
  `;

  card.onclick = ()=> location.href = `anime.html?title=${encodeURIComponent(anime.title)}`;
  return card;
}


function renderSlider(){
 slidesContainer.innerHTML="";
 const sliderItems = animes.slice(0,7);
 sliderItems.forEach(a=>{
   let div=document.createElement("div");
   div.className="slide";
   div.innerHTML=`<img src="${a.image}" style="width:100%;height:450px;object-fit:cover">`;
   div.onclick=()=>location.href=`anime.html?title=${encodeURIComponent(a.title)}`;
   slidesContainer.appendChild(div);
 });
 showSlide();
}

function showSlide(){
 const width=slidesContainer.offsetWidth;
 slidesContainer.style.transform=`translateX(${currentIndex * -width}px)`;
}

window.nextSlide=()=>{
 const max = slidesContainer.children.length-1;
 if(currentIndex<max) currentIndex++; else currentIndex=0;
 showSlide();
}
window.prevSlide=()=>{
 const max = slidesContainer.children.length-1;
 if(currentIndex>0) currentIndex--; else currentIndex=max;
 showSlide();
}
setInterval(nextSlide,5000);

function renderAnimeList(){
 animeList.innerHTML="";
 const text=searchInput.value.toLowerCase();
 let filtered=animes.filter(a=>{
   if(!a.title.toLowerCase().includes(text)) return false;
   if(activeFilters.length && !a.category?.some(c=>activeFilters.includes(c))) return false;
   if(activeTypeFilters.length && !activeTypeFilters.includes(a.type)) return false;
   return true;
 });

 const start=(currentPage-1)*itemsPerPage;
 filtered.slice(start,start+itemsPerPage).forEach(a=>animeList.appendChild(buildCard(a)));
}

document.getElementById("prevPage").onclick=()=>{if(currentPage>1){currentPage--;renderAnimeList();}}
document.getElementById("nextPage").onclick=()=>{currentPage++;renderAnimeList();}
searchInput.oninput=()=>{currentPage=1;renderAnimeList();};

function renderSection(id,arr,sectionName){
 const container=document.getElementById(id);
 container.innerHTML="";
 arr.slice(0,7).forEach(a=>container.appendChild(buildCard(a)));
 const more=document.createElement("div");
 more.className="more-card";
 more.textContent="مشاهدة المزيد";
 more.onclick=()=>location.href=`more.html?section=${sectionName}`;
 container.appendChild(more);
}

});

// لما يضغط على "أفلام الأنمي"
document.getElementById("moviesLink").onclick = (e)=>{
  e.preventDefault();
  location.href = "more.html?type=فيلم";
}

// لما يضغط على "مسلسلات الأنمي"
document.getElementById("seriesLink").onclick = (e)=>{
  e.preventDefault();
  location.href = "more.html?type=مسلسل";
}

// لما يضغط على "ملخصات الأنمي"
document.getElementById("schedulink").onclick = (e)=>{
  e.preventDefault();
  location.href = "more.html?type=ملخّص";
}


</script>

</body>
</html>
