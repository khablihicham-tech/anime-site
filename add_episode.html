<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة الأنمي</title>

<style>
body { font-family: Arial, sans-serif; background:#121212; color:#fff; margin:0; }
header { background:#ff3b3f; padding:15px; text-align:center; font-size:24px; font-weight:bold; }
.container { max-width:900px; margin:auto; padding:15px; }
form { background:#1c1c1c; padding:15px; border-radius:8px; margin-bottom:20px; }
input, select { width:100%; margin:6px 0; padding:10px; border-radius:5px; border:none; font-size:15px; }
button { padding:8px 15px; border:none; border-radius:5px; cursor:pointer; font-size:15px; }
.btn-add { background:#28a745; color:white; }
.btn-delete { background:#dc3545; color:white; }
.btn-edit { background:#ffc107; color:black; }
.anime-card { background:#1e1e1e; margin:10px 0; padding:10px; border-radius:8px; display:flex; }
.anime-card img { width:120px; height:160px; object-fit:cover; border-radius:8px; margin-right:15px; }
.category-box { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
.category-box span { background:#2a2a2a; padding:6px 14px; border-radius:20px; cursor:pointer; }
.category-box span.active { background:#ff3b3f; }
</style>
</head>

<body>

<header>إدارة الأنمي</header>

<div class="container">

<form id="episodeForm">

<input type="text" id="animeName" placeholder="اسم الأنمي">

<label>تصنيفات الأنمي</label>
<div id="categoryBox" class="category-box">
  <span>أكشن</span><span>مغامرة</span><span>رياضي</span>
  <span>غموض</span><span>كوميدي</span><span>دراما</span>
  <span>رومانسي</span><span>خيال علمي</span><span>فانتازيا</span>
</div>

<label>نوع الأنمي</label><br>
<input type="radio" name="animeType" value="مسلسل" checked> مسلسل
<input type="radio" name="animeType" value="فيلم"> فيلم
<input type="radio" name="animeType" value="ملخّص"> ملخّص
<br><br>

<input type="text" id="season" placeholder="الموسم">

<label>الحلقات</label>
<div id="episodesContainer"></div>
<button type="button" onclick="addEpisodeRow()" class="btn-add">+ حلقة جديدة</button>

<input type="text" id="animeImage" placeholder="رابط صورة الأنمي">
<button type="submit" class="btn-add">حفظ</button>

</form>

<!-- البحث و الفلترة -->
<div style="display:flex;gap:10px;margin:15px 0;">
  <input type="text" id="searchInput" placeholder="🔍 بحث عن أنمي...">
  <select id="filterType">
    <option value="">الكل حسب النوع</option>
    <option value="مسلسل">مسلسل</option>
    <option value="فيلم">فيلم</option>
    <option value="ملخّص">ملخّص</option>
  </select>
  <select id="filterCategory">
    <option value="">الكل حسب التصنيف</option>
    <option value="أكشن">أكشن</option>
    <option value="مغامرة">مغامرة</option>
    <option value="رياضي">رياضي</option>
    <option value="غموض">غموض</option>
    <option value="كوميدي">كوميدي</option>
    <option value="دراما">دراما</option>
    <option value="رومانسي">رومانسي</option>
    <option value="خيال علمي">خيال علمي</option>
    <option value="فانتازيا">فانتازيا</option>
  </select>
</div>

<div id="animeList"></div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
 apiKey: "AIzaSyBYEyu6TxSv1qSLCRvr0YCdaVcewhxAmQY",
 authDomain: "appp-1234.firebaseapp.com",
 databaseURL: "https://appp-1234-default-rtdb.firebaseio.com",
 projectId: "appp-1234",
 storageBucket: "appp-1234.firebasestorage.app",
 messagingSenderId: "666495369108",
 appId: "1:666495369108:web:aabf062e066cea6c3b9981"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const animesRef = db.ref("animes");

let animes = [];
let editIndex = null;

/* تحميل البيانات */
animesRef.on("value", snapshot => {
 const data = snapshot.val();
 animes = data ? Object.values(data) : [];
 renderAnimeList();
});

/* التصنيفات */
document.querySelectorAll("#categoryBox span").forEach(span=>{
 span.onclick = () => span.classList.toggle("active");
});

/* إضافة حلقة */
function addEpisodeRow(num="", link=""){
 const c = document.getElementById("episodesContainer");
 const d = document.createElement("div");
 d.style.display="flex";
 d.style.gap="10px";
 d.innerHTML = `
 <input class="epNum" placeholder="رقم الحلقة" value="${num}">
 <input class="epLink" placeholder="رابط الحلقة" value="${link}">
 <button onclick="this.parentElement.remove()" class="btn-delete">✖</button>`;
 c.appendChild(d);
}
addEpisodeRow();

/* جمع الحلقات */
function collectEpisodes(){
 const eps=[];
 document.querySelectorAll("#episodesContainer div").forEach(r=>{
  const n=r.querySelector(".epNum").value.trim();
  const l=r.querySelector(".epLink").value.trim();
  if(n&&l) eps.push({title:"الحلقة "+n, video:l});
 });
 return eps;
}

/* حفظ */
episodeForm.onsubmit = e =>{
 e.preventDefault();
 const title=animeName.value.trim();
 const seasonVal=season.value.trim();
 const img=animeImage.value.trim();
 const type=document.querySelector('input[name="animeType"]:checked').value;
 const cat=[...document.querySelectorAll("#categoryBox .active")].map(s=>s.textContent);
 const episodes=collectEpisodes();

 if(!title||!seasonVal||!cat.length||!episodes.length){
  alert("عمر جميع الخانات");
  return;
 }

 const obj={title,season:seasonVal,image:img,type,category:cat,episodes};

 if(editIndex!==null){
  animes[editIndex]=obj;
  editIndex=null;
 }else{
  animes.unshift(obj);
 }

 animesRef.set(animes);

 episodeForm.reset();
 document.getElementById("episodesContainer").innerHTML="";
 addEpisodeRow();
 document.querySelectorAll("#categoryBox span").forEach(s=>s.classList.remove("active"));
 document.querySelector('input[value="مسلسل"]').checked=true;
};

/* عرض */
function renderAnimeList(){
 const list=animeList;
 list.innerHTML="";
 let f=[...animes];

 const s=searchInput.value.toLowerCase();
 if(s) f=f.filter(a=>a.title && a.title.toLowerCase().includes(s));

 if(filterType.value) f=f.filter(a=>a.type===filterType.value);
 if(filterCategory.value) f=f.filter(a=>a.category.includes(filterCategory.value));

 f.forEach(a=>{
  const i=animes.indexOf(a);
  list.innerHTML+=`
  <div class="anime-card">
   <img src="${a.image}">
   <div>
    <h3>${a.title} - ${a.season} (${a.type})</h3>
    <p>عدد الحلقات: ${a.episodes.length}</p>
    <button class="btn-edit" onclick="editAnime(${i})">تعديل</button>
    <button class="btn-delete" onclick="deleteAnime(${i})">حذف</button>
   </div>
  </div>`;
 });
}

function deleteAnime(i){
 if(confirm("متأكد؟")){
  animes.splice(i,1);
  animesRef.set(animes);
 }
}

function editAnime(i){
 const a=animes[i];
 editIndex=i;
 animeName.value=a.title;
 season.value=a.season;
 animeImage.value=a.image;
 document.querySelectorAll('input[name="animeType"]').forEach(r=>r.checked=r.value==a.type);
 document.querySelectorAll("#categoryBox span").forEach(s=>{
  s.classList.toggle("active",a.category.includes(s.textContent));
 });
 episodesContainer.innerHTML="";
 a.episodes.forEach(e=>addEpisodeRow(e.title.replace("الحلقة ",""),e.video));
 window.scrollTo({top:0,behavior:"smooth"});
}

searchInput.oninput=renderAnimeList;
filterType.onchange=renderAnimeList;
filterCategory.onchange=renderAnimeList;
</script>

</body>
</html>
