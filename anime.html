<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشاهدة الأنمي</title>

<style>
.top-header{
  background:#FF3B3F;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 20px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
  direction: rtl;
}
.logo img{ height:45px; }
.nav-links{ display:flex; gap:20px; font-size:16px; font-weight:bold; }
.nav-links a{ color:#000; text-decoration:none; }
.nav-links a:hover{ color:#ff3b3f; }
.search-btn{
  background:#fff; border-radius:50%;
  width:40px; height:40px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}
.search-btn img{ width:18px; }

body{
  font-family:Arial,sans-serif;
  background:#121212;
  color:#fff;
  margin:0;
  text-align:center;
}

button{
  margin:5px; padding:10px 15px;
  border:none; border-radius:5px;
  cursor:pointer;
  background:#ff3b3f;
  color:#fff;
}

#episodeList{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:10px;
  max-width:900px;
  margin:20px auto;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  justify-content:center;
  align-items:center;
  z-index:999;
}
.modal-content{
  background:#000;
  padding:10px;
  border-radius:10px;
  width:90%;
  max-width:900px;
  position:relative;
}
.close-btn{
  position:absolute;
  top:5px; right:10px;
  background:#ff3b3f;
  color:#fff;
  border:none;
  padding:5px 10px;
  cursor:pointer;
}
iframe{
  width:100%;
  height:500px;
  border:none;
  border-radius:10px;
}
.anime-img{
  width:95%;
  max-width:600px;
  margin-top:20px;
  border-radius:10px;
  box-shadow:0 0 20px #ff3b3f;
}
.anime-categories,.anime-type{
  margin:10px 0;
  color:#ffcc00;
}
.view-counter{ color:#ffcc00; font-size:14px; }
</style>
</head>

<body>

<div class="top-header">
  <div class="search-btn">
    <img src="https://cdn-icons-png.flaticon.com/512/622/622669.png">
  </div>

  <div class="nav-links">
    <a href="index.html">الرئيسية</a>
    <a href="articles.html">مقالات الأنمي</a>
    <a href="#" id="moviesLink">أفلام الأنمي</a>
    <a href="#" id="seriesLink">مسلسلات الأنمي</a>
    <a href="#" id="schedulink">ملخصات الأنمي</a>
    <a href="contact.html">اتصل بنا</a>
  </div>

  <div class="logo">
    <img src="https://i.postimg.cc/X7qqxbYp/logo.png">
  </div>
</div>

<button onclick="location.href='index.html'">⬅ الرجوع</button>

<div id="animeContainer"><p>جارٍ التحميل...</p></div>

<div id="videoModal" class="modal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal()">✖</button>
    <iframe id="videoFrame" allowfullscreen></iframe>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
// ===== Firebase =====
firebase.initializeApp({
  apiKey: "AIzaSyBYEyu6TxSv1qSLCRvr0YCdaVcewhxAmQY",
  authDomain: "appp-1234.firebaseapp.com",
  databaseURL: "https://appp-1234-default-rtdb.firebaseio.com",
  projectId: "appp-1234"
});

const db = firebase.database();
const ref = db.ref("animes");

const params = new URLSearchParams(location.search);
const animeTitle = params.get("title");

ref.once("value", snap=>{
  const data = snap.val();
  if(!data) return;

  Object.keys(data).forEach(k=>{
    if(data[k].title === animeTitle){
      showAnime(data[k], k);
    }
  });
});

function showAnime(anime, key){
  document.getElementById("animeContainer").innerHTML = `
    <img src="${anime.image}" class="anime-img">
    <h2>${anime.title}</h2>
    <div class="anime-categories">التصنيفات: ${anime.category.join("، ")}</div>
    <div class="anime-type">النوع: ${anime.type}</div>
    <div class="view-counter">👁 ${(anime.views||0)+1} مشاهدة</div>
    <h3>${anime.season}</h3>
    <div id="episodeList"></div>
  `;

  db.ref("animes/"+key+"/views").transaction(v=>(v||0)+1);

  const list = document.getElementById("episodeList");
  anime.episodes.forEach(ep=>{
    const b = document.createElement("button");
    b.textContent = ep.title;
    b.onclick = ()=> openModal(ep.video);
    list.appendChild(b);
  });
}

// ===== تمييز التاريخ =====
function isDate(v){
  return /^\d{2}\/\d{2}\/\d{4}$/.test(v);
}

// ===== تشغيل الحلقة =====
function openModal(videoUrl){

  // 📅 تاريخ → صفحة الموعد
  if(isDate(videoUrl)){
    location.href =
      `episode-date.html?date=${encodeURIComponent(videoUrl)}&anime=${encodeURIComponent(animeTitle)}`;
    return;
  }

  const adLink="https://www.effectivegatecpm.com/g31pp6c9?key=08a82cb4c410cfb14ad1a25abef6221d";
  let c=sessionStorage.getItem("episodeClicks")||0;
  c++;
  sessionStorage.setItem("episodeClicks",c);

  if(c<=2){ window.open(adLink,"_blank"); return; }
  if(c>=3) sessionStorage.setItem("episodeClicks",0);

  if(videoUrl.includes("youtube.com/watch")){
    const id=new URL(videoUrl).searchParams.get("v");
    if(id) videoUrl="https://www.youtube.com/embed/"+id;
  }

  document.getElementById("videoFrame").src=videoUrl;
  document.getElementById("videoModal").style.display="flex";
}

function closeModal(){
  videoFrame.src="";
  videoModal.style.display="none";
}

// links
moviesLink.onclick=e=>{e.preventDefault();location.href="more.html?type=فيلم";}
seriesLink.onclick=e=>{e.preventDefault();location.href="more.html?type=مسلسل";}
schedulink.onclick=e=>{e.preventDefault();location.href="more.html?type=ملخّص";}
</script>

</body>
</html>
