 <!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موعد نزول الحلقة</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#121212;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  text-align:center;
}

.card{
  background:#1e1e1e;
  padding:30px;
  border-radius:15px;
  max-width:420px;
  width:90%;
  box-shadow:0 0 25px rgba(255,59,63,0.5);
}

.card h1{
  color:#ff3b3f;
  margin-bottom:15px;
}

.date{
  font-size:20px;
  color:#ffcc00;
  margin:10px 0;
}

button{
  margin-top:20px;
  padding:10px 18px;
  border:none;
  border-radius:6px;
  background:#ff3b3f;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}
button:hover{ opacity:0.85; }
</style>
</head>

<body>

<div class="card">
  <h1>⏳ الحلقة لم تصدر بعد</h1>
  <p>موعد نزول الحلقة المتوقع:</p>
  <div class="date" id="dateText"></div>
  <button onclick="goBack()">⬅ الرجوع للأنمي</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const date = params.get("date");
const anime = params.get("anime");

document.getElementById("dateText").textContent = date || "غير محدد";

function goBack(){
  if(anime){
    window.location.href = "anime.html?title=" + encodeURIComponent(anime);
  }else{
    history.back();
  }
}
</script>

</body>
</html>
